services:
  postgres:
    ports: !reset []

  backend:
    ports: !reset []

  frontend:
    ports: !reset []

  gateway:
    image: nginx:1.27-alpine
    container_name: finlab_gateway
    restart: unless-stopped
    depends_on:
      - frontend
      - backend
    volumes:
      - ./deploy/nginx/finlab.conf:/etc/nginx/conf.d/default.conf:ro
    environment:
      VIRTUAL_HOST: jirniydizainer.ru,www.jirniydizainer.ru
      LETSENCRYPT_HOST: jirniydizainer.ru,www.jirniydizainer.ru
      LETSENCRYPT_EMAIL: nikitalosenov@gmail.com
      VIRTUAL_PORT: 80
    networks:
      - default
      - proxy

networks:
  proxy:
    external: true
    name: moex-analyzer_default
